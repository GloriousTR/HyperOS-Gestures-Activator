plugins {
    id "com.android.application"
}

def releaseKeystoreProperties = new Properties()
def releaseKeystoreFile = rootProject.file("keystore.properties")
if (releaseKeystoreFile.exists()) {
    releaseKeystoreFile.withInputStream { releaseKeystoreProperties.load(it) }
}

def gitCommitCount = providers.exec {
    workingDir rootProject.projectDir
    commandLine "git", "rev-list", "--count", "HEAD"
    ignoreExitValue = true
}.standardOutput.asText.map { output ->
    def count = output.trim()
    count.isEmpty() ? 1 : Integer.parseInt(count)
}

android {
    namespace "dev.glorioustr.hyperosgesturesactivator"
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "dev.glorioustr.hyperosgesturesactivator"
        minSdk 35
        targetSdk 36
        versionCode gitCommitCount.get()
        versionName "1.0.0"
    }

    signingConfigs {
        if (releaseKeystoreFile.exists()) {
            release {
                storeFile rootProject.file(releaseKeystoreProperties["storeFile"])
                storePassword releaseKeystoreProperties["storePassword"]
                keyAlias releaseKeystoreProperties["keyAlias"]
                keyPassword releaseKeystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-activation"
        }
        release {
            minifyEnabled true
            shrinkResources true
            if (releaseKeystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly "io.github.libxposed:api:102.0.0"
}
